name: VTX DEX Bot Deploy

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install python-telegram-bot==20.8 requests==2.31.0 pytz==2024.1 gdown
          sudo apt update
          sudo apt install apktool openjdk-17-jdk -y

      - name: Restore Database
        uses: actions/cache@v4
        with:
          path: vtxdex.db
          key: vtxdex-db-${{ github.run_id }}
          restore-keys: |
            vtxdex-db-

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: "8859660196:AAFnaqQAFo_DHZ3lEYRyNAEgG54IscXW8vg"
          ADMIN_ID: "5510702228"
        run: |
          python bot.py

      - name: Save Database
        if: always()
        uses: actions/cache@v4
        with:
          path: vtxdex.db
          key: vtxdex-db-${{ github.run_id }}
